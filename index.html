<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>집 지도</title>
<style>
:root{
  --bg:#F4F4F6; --surface:#FFFFFF; --ink:#111113; --sub:#6C6C72; --line:#E7E7EB; --press:#ECECF0;
  --accent:#2F6FEB; --on-accent:#FFFFFF;
  --apt:#2F6FEB; --kids:#1E8A55; --kinder:#7B4FD6; --ped:#D2453B; --pharm:#C0742A; --school:#3B6E8F; --park:#4E8B2E; --kidscafe:#C2408A; --station:#333338;
  --good:#1E874A; --warn:#C97400; --bad:#C2372F; --note:#E8B400;
  --font:system-ui, "SamsungOne", "Samsung Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --surface:#17171A; --ink:#F1F1F3; --sub:#9B9BA2; --line:#2A2A2E; --press:#222226; --accent:#5E8FF2; color-scheme:dark; }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

#map{position:fixed;inset:0;background:#E9E6DF}

/* top controls */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(10px + var(--top)) 12px 0;display:grid;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.searchbar{display:flex;align-items:center;gap:4px;height:52px;background:var(--surface);border-radius:26px;padding:0 6px 0 18px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.searchbar input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-width:0}
.ibtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn:active{background:var(--press)}
.ibtn svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px 0 10px;border-radius:18px;background:var(--surface);font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 5px rgba(0,0,0,.12);color:var(--sub)}
.chip i{width:10px;height:10px;border-radius:5px;background:var(--c);opacity:.35}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600}
.chip[aria-pressed="true"] i{opacity:1}
.again{justify-self:center;height:36px;padding:0 16px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);display:none}
.again.show{display:block}
.zoomhint{justify-self:center;font-size:13px;background:rgba(17,17,19,.78);color:#fff;padding:6px 12px;border-radius:14px;display:none}
.zoomhint.show{display:block}

/* bottom controls */
.side{position:fixed;right:12px;bottom:calc(96px + var(--bot));z-index:10;display:grid;gap:10px}
.round{width:48px;height:48px;border-radius:24px;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.16);color:var(--ink)}
.round svg{width:22px;height:22px}
.round:active{background:var(--press)}
.bottombar{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--bot));z-index:10;display:flex;gap:10px}
.bb{height:56px;border-radius:28px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15.5px;padding:0 20px}
.bb.list{flex:1}
.bb.memo{background:var(--ink);color:var(--bg);flex:1}
.bb svg{width:20px;height:20px}

/* placing mode */
.cross{position:fixed;left:50%;top:50%;z-index:9;transform:translate(-50%,-100%);display:none;pointer-events:none}
.cross svg{width:40px;height:52px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.placebar{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--bot));z-index:11;display:none;gap:10px}
.placebar .bb{flex:1}
.placebar .bb.ok{background:var(--accent);color:#fff}
.placetip{position:fixed;left:0;right:0;top:calc(76px + var(--top));z-index:11;display:none;justify-content:center}
.placetip span{background:rgba(17,17,19,.82);color:#fff;font-size:14px;padding:8px 14px;border-radius:16px}
body.placing .cross{display:block}
body.placing .placebar,body.placing .placetip{display:flex}
body.placing .bottombar,body.placing .side,body.placing .chips,body.placing .again{display:none}

/* markers */
.mk{font-family:var(--font);cursor:pointer;display:block}
.mk.poi{width:26px;height:26px;border-radius:13px;background:var(--c);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk.apt{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 7px;border-radius:14px;background:#fff;color:#111;border:1.5px solid var(--apt);font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);position:relative}
.mk.apt i{width:9px;height:9px;border-radius:2px;background:var(--apt);flex:none}
.mk.apt::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--apt);border-bottom:0}
.mk.apt.s-interest{border-color:#E09A00;background:#FFF6DD}
.mk.apt.s-interest i{background:#E09A00}.mk.apt.s-interest::after{border-top-color:#E09A00}
.mk.apt.s-plan{border-color:var(--accent);background:#E8EFFE}
.mk.apt.s-visited{border-color:var(--good);background:#E5F4EA}
.mk.apt.s-visited i{background:var(--good)}.mk.apt.s-visited::after{border-top-color:var(--good)}
.mk.apt.s-no{border-color:#999;background:#EEE;color:#888;text-decoration:line-through}
.mk.apt.s-no i{background:#999}.mk.apt.s-no::after{border-top-color:#999}
.mk.apt b{font-weight:700;color:#E09A00;font-size:11px}
body.far .mk.apt span{display:none}
body.far .mk.apt{padding:0 7px}
.mk.memo{position:relative;max-width:150px;background:var(--note);color:#2A2200;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:8px 8px 8px 2px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.memo.good{background:#7CD08F}.mk.memo.warn{background:#FFB547}.mk.memo.bad{background:#FF8278;color:#2A0000}
body.far .mk.memo{max-width:96px}
.mk.base{background:#111;color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap}
.mk.me{width:18px;height:18px;border-radius:9px;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,111,235,.22)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:19;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);max-height:78%;overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(24px + var(--bot));transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{position:sticky;top:0;background:var(--surface);padding:10px 0 4px;display:grid;place-items:center;z-index:1}
.grab i{width:40px;height:4px;border-radius:2px;background:var(--line)}
.sh{padding:4px 20px 0}
.sh .cat{font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center}
.sh h2{font-size:22px;font-weight:700;line-height:1.3;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.sh .addr{font-size:14px;color:var(--sub);margin-top:4px}
.sh .x{position:absolute;right:10px;top:12px}
.acts{display:flex;gap:8px;padding:14px 20px 4px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:none;height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.act:active{background:var(--press)}
.blk{margin:14px 12px 0;background:var(--bg);border-radius:20px;padding:4px 0}
.blkh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 6px;font-size:13px;color:var(--sub);font-weight:600}
.r{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;font-size:15px;position:relative}
.r + .r::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.r .k{color:var(--sub);flex:none}
.r .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.r.tap{width:100%;text-align:left}
.r.tap:active{background:var(--press)}
.muted{color:var(--sub);font-size:14px;padding:10px 16px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 10px}
.seg button{height:40px;border-radius:14px;font-size:13.5px;font-weight:600;color:var(--sub);background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stars{display:flex;gap:2px;padding:0 10px 6px}
.stars button{width:40px;height:40px;font-size:24px;color:var(--line)}
.stars button.on{color:#E09A00}
.fld{display:block;padding:8px 16px}
.fld span{display:block;font-size:12.5px;color:var(--sub)}
.fld input,.fld textarea,.fld select{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;outline:none;font-size:16px;border-radius:0}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-bottom-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr}
.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:25px;font-weight:700;font-size:16px;background:var(--bg)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btns{display:grid;gap:8px;padding:14px 12px 0}
.btns.two{grid-template-columns:1fr 1fr}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px}
.tag{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);font-size:14px;color:var(--sub);background:var(--surface)}
.tag[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.tone{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 10px}
.tone button{height:40px;border-radius:14px;font-size:13.5px;font-weight:600;background:var(--surface);color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.tone button i{width:10px;height:10px;border-radius:5px}
.tone button[aria-pressed="true"]{outline:2px solid var(--ink);color:var(--ink)}
.memotext{padding:6px 16px 12px;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.tagline{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.tagline span{font-size:13px;background:var(--surface);border-radius:12px;padding:3px 10px}

/* pages */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.page.open{transform:none;visibility:visible;transition:transform .22s ease}
.pbar{position:sticky;top:0;z-index:2;height:calc(56px + var(--top));padding:var(--top) 8px 0 4px;display:flex;align-items:center;gap:4px;background:var(--bg)}
.pbar .ttl{flex:1;font-size:19px;font-weight:700;margin-left:4px}
.tbtn{height:44px;padding:0 14px;border-radius:22px;font-weight:700;color:var(--accent)}
.pbody{padding:4px 0 calc(40px + var(--bot))}
.pbody .blk{background:var(--surface)}
.ptabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px}
.ptabs button{height:42px;border-radius:14px;font-weight:600;color:var(--sub);background:var(--surface)}
.ptabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.li{display:block;width:100%;text-align:left;padding:14px 16px;position:relative}
.li + .li::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.li:active{background:var(--press)}
.li b{font-size:16px}
.li .s{display:block;font-size:13.5px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:9px;margin-left:6px;vertical-align:2px}
.b-interest{background:#FFF0C7;color:#8A5E00}.b-plan{background:#E2EAFD;color:#2448A8}.b-visited{background:#DDF1E3;color:#1B6B3A}.b-no{background:#EEE;color:#777}
.hint{padding:10px 16px 2px;color:var(--sub);font-size:13.5px}
.setup{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(40px + var(--top)) 20px calc(40px + var(--bot));display:none}
.setup.show{display:block}
.setup h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.setup p{color:var(--sub);margin-top:10px;font-size:15px}
.setup ol{margin:18px 0 0;padding-left:20px;display:grid;gap:10px;font-size:15px}
.setup code{font-size:13.5px;background:var(--surface);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.setup .card{background:var(--surface);border-radius:20px;padding:6px 0;margin-top:22px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--bot));z-index:50;margin:0 auto;max-width:420px;background:#2A2A2E;color:#fff;padding:13px 18px;border-radius:20px;font-size:14.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .sheet,.page{transition:none} }
</style>
</head>
<body class="far">
<div id="map"></div>

<div class="top">
  <form class="searchbar" id="searchForm" role="search">
    <input id="q" type="search" placeholder="단지·장소 검색" enterkeyhint="search" autocomplete="off" aria-label="단지·장소 검색">
    <button class="ibtn" type="button" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg></button>
  </form>
  <div class="chips" id="chips" role="group" aria-label="지도에 표시할 항목"></div>
  <button class="again" id="again">이 지역 다시 찾기</button>
  <div class="zoomhint" id="zoomhint">지도를 조금 더 확대하면 시설이 보입니다</div>
</div>

<div class="side">
  <button class="round" id="baseBtn" aria-label="기준 위치로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></button>
  <button class="round" id="locBtn" aria-label="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div class="bottombar">
  <button class="bb list" id="listBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>내 기록 <span id="cnt" style="color:var(--sub);font-weight:500"></span></button>
  <button class="bb memo" id="memoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>지도에 메모</button>
</div>

<div class="cross"><svg viewBox="0 0 40 52" aria-hidden="true"><path d="M20 51C20 51 4 32 4 20a16 16 0 0132 0c0 12-16 31-16 31z" fill="#111113" stroke="#fff" stroke-width="2.5"/><circle cx="20" cy="20" r="6" fill="#fff"/></svg></div>
<div class="placetip"><span>지도를 움직여 핀을 원하는 곳에 맞추세요</span></div>
<div class="placebar"><button class="bb" id="placeCancel">취소</button><button class="bb ok" id="placeOk">여기에 메모</button></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false"></div>
<section class="page" id="pList" aria-label="내 기록"></section>
<section class="page" id="pMemo" aria-label="메모"></section>
<section class="page" id="pSet" aria-label="설정"></section>
<div class="setup" id="setup"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- config ---------- */
const DEFAULT_BASE = {name:"한성대", lat:37.58245, lng:127.01036};
const LAYERS = [
  {id:"apt",     label:"아파트",          c:"var(--apt)",      on:true},
  {id:"kids",    label:"어린이집·유치원", c:"var(--kids)",     on:true},
  {id:"ped",     label:"소아과",          c:"var(--ped)",      on:true},
  {id:"school",  label:"초등학교",        c:"var(--school)",   on:false},
  {id:"pharm",   label:"약국",            c:"var(--pharm)",    on:false},
  {id:"park",    label:"공원",            c:"var(--park)",     on:false},
  {id:"kidscafe",label:"키즈카페",        c:"var(--kidscafe)", on:false},
  {id:"station", label:"지하철",          c:"var(--station)",  on:true},
  {id:"memo",    label:"내 메모",         c:"var(--note)",     on:true}
];
const GLYPH = {kids:"어", kinder:"유", ped:"소", school:"초", pharm:"약", park:"공", kidscafe:"키", station:"역"};
const COLOR = {kids:"var(--kids)", kinder:"var(--kinder)", ped:"var(--ped)", school:"var(--school)", pharm:"var(--pharm)", park:"var(--park)", kidscafe:"var(--kidscafe)", station:"var(--station)"};
const KIND_LABEL = {apt:"아파트", kids:"어린이집", kinder:"유치원", ped:"소아과", school:"초등학교", pharm:"약국", park:"공원", kidscafe:"키즈카페", station:"지하철역", place:"장소"};
const STATUS = [["interest","관심"],["plan","방문 예정"],["visited","방문함"],["no","제외"]];
const TONES = [["note","일반","var(--note)"],["good","좋음","#7CD08F"],["warn","주의","#FFB547"],["bad","나쁨","#FF8278"]];
const TAGS = ["언덕","소음","주차","채광","학원가","산책로","놀이터","상가","공사","유흥가","통학로","대중교통"];
const MAX_LEVEL = 5;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600); }
function dist(a,b){ const R=6371000, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtD = m => m<1000 ? Math.round(m/10)*10+"m" : (m/1000).toFixed(1)+"km";
const walk = m => Math.max(1, Math.round(m*1.25/67))+"분"; // 직선거리×1.25, 분당 67m
function debounce(f,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>f(...a),ms); }; }

/* ---------- storage ---------- */
const K = {key:"housemap-kakao-key", data:"housemap-data-v1", layers:"housemap-layers", view:"housemap-view"};
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast("저장 공간 오류로 저장하지 못했습니다"); return false; } } };
let data = ls.get(K.data, null) || {places:{}, memos:[], base:DEFAULT_BASE};
if(!data.places) data.places={}; if(!Array.isArray(data.memos)) data.memos=[]; if(!data.base) data.base=DEFAULT_BASE;
const save = () => { ls.set(K.data, data); updateCount(); };
const layerOn = Object.assign(Object.fromEntries(LAYERS.map(l=>[l.id,l.on])), ls.get(K.layers, {}));
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
function updateCount(){ const n = Object.keys(data.places).length + data.memos.length; $("#cnt").textContent = n ? n : ""; }

/* ---------- page stack (Android back) ---------- */
const stack = [];
function push(name, open, close){ stack.push({name, close}); open(); history.pushState({d:stack.length}, ""); }
let afterPop = null;
window.addEventListener("popstate", ()=>{ const top = stack.pop(); if(top) top.close(); if(afterPop){ const f=afterPop; afterPop=null; f(); } });
const back = () => { if(stack.length) history.back(); };
const backThen = fn => { if(!stack.length){ fn(); return; } afterPop = fn; history.back(); };

/* ---------- map ---------- */
const layerMarks = {};     // layer -> Map(id -> {ov, p})
let savedMarks = new Map(), memoMarks = new Map(), baseMark = null, meMark = null;
const LL = (lat,lng) => new kakao.maps.LatLng(lat,lng);

function initMap(){
  ready = true; $("#setup").classList.remove("show");
  const v = ls.get(K.view, null);
  map = new kakao.maps.Map($("#map"), {center: LL(v?v.lat:data.base.lat, v?v.lng:data.base.lng), level: v?v.level:4});
  places = new kakao.maps.services.Places(map);
  kakao.maps.event.addListener(map, "idle", debounce(onIdle, 350));
  kakao.maps.event.addListener(map, "zoom_changed", zoomClass);
  kakao.maps.event.addListener(map, "click", ()=>{ if(sheetOpen()) back(); });
  zoomClass(); drawBase(); drawSaved(); drawMemos(); onIdle();
}
function zoomClass(){ const lv = map.getLevel(); document.body.classList.toggle("far", lv>4); $("#zoomhint").classList.toggle("show", lv>MAX_LEVEL && LAYERS.some(l=>l.id!=="memo"&&layerOn[l.id])); }
function overlay(lat,lng,html,yAnchor,z,onTap){
  const el = document.createElement("div"); el.innerHTML = html; const node = el.firstElementChild;
  node.addEventListener("click", e=>{ e.stopPropagation(); onTap(); });
  const ov = new kakao.maps.CustomOverlay({position:LL(lat,lng), content:node, yAnchor, zIndex:z, clickable:true});
  ov.setMap(map); return ov;
}
function drawBase(){
  if(baseMark) baseMark.setMap(null);
  baseMark = overlay(data.base.lat, data.base.lng, `<div class="mk base">${esc(data.base.name||"기준")}</div>`, 0.5, 6, ()=>{});
}

/* search helpers */
function query(type, q, opts, maxPages){
  return new Promise(res=>{
    const out=[]; let n=0; const S=kakao.maps.services.Status;
    const cb=(d,st,pg)=>{ if(st===S.OK){ out.push(...d); n++; if(pg && pg.hasNextPage && n<maxPages){ pg.nextPage(); return; } } res(out); };
    try{ type==="cat" ? places.categorySearch(q, cb, opts) : places.keywordSearch(q, cb, opts); }catch(e){ res(out); }
  });
}
const inView = {useMapBounds:true};
function kindOf(p, layer){
  if(layer==="kids" || p.category_group_code==="PS3") return /유치원/.test(p.place_name) ? "kinder" : "kids";
  return layer;
}
const FETCH = {
  apt: async()=> (await query("kw","아파트",inView,3)).filter(p=>/아파트$/.test(p.category_name) && !/\d+\s*동$|상가|관리사무소|경로당|어린이집/.test(p.place_name)),
  kids: ()=> query("cat","PS3",inView,3),
  ped: async()=>{ const a = await query("kw","소아청소년과",Object.assign({category_group_code:"HP8"},inView),2);
                  const b = await query("kw","아동병원",Object.assign({category_group_code:"HP8"},inView),1);
                  return a.concat(b).filter(p=>/소아|아동/.test(p.place_name+p.category_name)); },
  school: async()=> (await query("cat","SC4",inView,2)).filter(p=>/초등학교$/.test(p.place_name)),
  pharm: ()=> query("cat","PM9",inView,2),
  park: async()=> (await query("kw","공원",inView,2)).filter(p=>/공원/.test(p.category_name)),
  kidscafe: ()=> query("kw","키즈카페",inView,1),
  station: async()=> (await query("cat","SW8",inView,1))
};
let lastFetchCenter = null;
async function onIdle(){
  const c = map.getCenter(); ls.set(K.view, {lat:c.getLat(), lng:c.getLng(), level:map.getLevel()});
  zoomClass();
  if(map.getLevel() > MAX_LEVEL){ $("#again").classList.remove("show"); return; }
  await refreshLayers();
}
async function refreshLayers(){
  $("#again").classList.remove("show");
  const ids = LAYERS.map(l=>l.id).filter(id=>id!=="memo" && layerOn[id]);
  LAYERS.forEach(l=>{ if(l.id!=="memo" && !layerOn[l.id]) clearLayer(l.id); });
  await Promise.all(ids.map(async id=>{ const res = await FETCH[id](); drawLayer(id, res); }));
  const c = map.getCenter(); lastFetchCenter = {lat:c.getLat(), lng:c.getLng()};
}
function clearLayer(id){ const m = layerMarks[id]; if(!m) return; m.forEach(x=>x.ov.setMap(null)); m.clear(); }
function drawLayer(id, res){
  const m = layerMarks[id] || (layerMarks[id] = new Map());
  const seen = new Set();
  for(const p of res){
    if(seen.has(p.id)) continue; seen.add(p.id);
    if(data.places[p.id]) continue;            // saved ones drawn separately
    if(m.has(p.id)) continue;
    const kind = kindOf(p, id);
    const lat=+p.y, lng=+p.x;
    const html = id==="apt"
      ? `<button class="mk apt"><i></i><span>${esc(shortName(p.place_name))}</span></button>`
      : `<button class="mk poi" style="--c:${COLOR[kind]}" aria-label="${esc(p.place_name)}">${GLYPH[kind]}</button>`;
    const ov = overlay(lat,lng,html, id==="apt"?1.25:0.5, id==="apt"?4:3, ()=>openPlace(fromKakao(p, kind)));
    m.set(p.id, {ov, p});
  }
  m.forEach((x,k)=>{ if(!seen.has(k) || data.places[k]){ x.ov.setMap(null); m.delete(k); } });
}
const shortName = n => n.replace(/아파트$/,"").replace(/\s+/g," ").trim() || n;
function fromKakao(p, kind){
  return {id:p.id, name:p.place_name, lat:+p.y, lng:+p.x, kind, cat:p.category_name, addr:p.road_address_name||p.address_name, phone:p.phone||"", url:(p.place_url||"").replace(/^http:/,"https:")};
}
function kindFromCat(p){
  const c = p.category_name||"", code=p.category_group_code;
  if(/아파트$/.test(c)) return "apt";
  if(code==="PS3") return /유치원/.test(p.place_name)?"kinder":"kids";
  if(code==="HP8" && /소아|아동/.test(p.place_name+c)) return "ped";
  if(code==="SC4" && /초등학교/.test(p.place_name)) return "school";
  if(code==="PM9") return "pharm"; if(code==="SW8") return "station";
  if(/키즈카페/.test(c+p.place_name)) return "kidscafe"; if(/공원/.test(c)) return "park";
  return "place";
}

/* saved places + memos on map */
function drawSaved(){
  savedMarks.forEach(o=>o.setMap(null)); savedMarks = new Map();
  Object.values(data.places).forEach(s=>{
    const st = s.status ? " s-"+s.status : "";
    const star = s.rating ? `<b>★${s.rating}</b>` : "";
    const html = s.kind==="apt"
      ? `<button class="mk apt${st}"><i></i><span>${esc(shortName(s.name))}</span>${star}</button>`
      : `<button class="mk poi" style="--c:${COLOR[s.kind]||"#555"};outline:3px solid #E09A00" aria-label="${esc(s.name)}">${GLYPH[s.kind]||"•"}</button>`;
    savedMarks.set(s.id, overlay(s.lat, s.lng, html, s.kind==="apt"?1.25:0.5, 5, ()=>openPlace(s)));
  });
  Object.values(layerMarks).forEach(m=>m.forEach((x,k)=>{ if(data.places[k]){ x.ov.setMap(null); m.delete(k); } }));
}
function drawMemos(){
  memoMarks.forEach(o=>o.setMap(null)); memoMarks = new Map();
  if(!layerOn.memo) return;
  data.memos.forEach(n=>{
    memoMarks.set(n.id, overlay(n.lat, n.lng, `<button class="mk memo ${n.tone||"note"}">${esc(n.title||"메모")}</button>`, 1.15, 7, ()=>openMemo(n.id)));
  });
}

/* ---------- chips ---------- */
function renderChips(){
  $("#chips").innerHTML = LAYERS.map(l=>`<button class="chip" data-l="${l.id}" style="--c:${l.c}" aria-pressed="${!!layerOn[l.id]}"><i></i>${l.label}</button>`).join("");
}
$("#chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return; const id=b.dataset.l;
  layerOn[id] = !layerOn[id]; ls.set(K.layers, layerOn); b.setAttribute("aria-pressed", String(layerOn[id]));
  if(!ready) return;
  if(id==="memo") drawMemos();
  else if(!layerOn[id]) clearLayer(id);
  else if(map.getLevel()<=MAX_LEVEL) FETCH[id]().then(r=>drawLayer(id,r));
  zoomClass();
});
$("#again").onclick = refreshLayers;

const sheetOpen = () => $("#sheet").classList.contains("open");
function openSheet(html, after){
  const s = $("#sheet");
  const fill = ()=>{ s.innerHTML = `<div class="grab"><i></i></div>` + html; s.scrollTop = 0; if(after) after(s); };
  if(sheetOpen()){ fill(); return; }
  push("sheet", ()=>{ fill(); s.classList.add("open"); }, ()=>{ s.classList.remove("open"); });
}

/* place detail */
let curPlace = null;
function linksFor(p){
  const L = [];
  if(p.url) L.push(["카카오맵 후기·사진", p.url]);
  if(p.kind==="apt"){
    L.push(["네이버 부동산 시세·매물", `https://m.land.naver.com/search/result/${enc(p.name)}`]);
    L.push(["실거래가 검색", `https://m.search.naver.com/search.naver?query=${enc(p.name+" 실거래가")}`]);
    L.push(["주민 후기 검색", `https://m.search.naver.com/search.naver?query=${enc(p.name+" 아파트 후기")}`]);
    L.push(["국토부 실거래가", "https://rt.molit.go.kr/"]);
  }else if(p.kind==="kids"){
    L.push(["아이사랑 정보공시", "https://info.childcare.go.kr/"]);
    L.push(["후기 검색", `https://m.search.naver.com/search.naver?query=${enc(p.name+" 후기")}`]);
  }else if(p.kind==="kinder"){
    L.push(["유치원알리미", "https://e-childschoolinfo.moe.go.kr/"]);
    L.push(["후기 검색", `https://m.search.naver.com/search.naver?query=${enc(p.name+" 후기")}`]);
  }else{
    L.push(["후기 검색", `https://m.search.naver.com/search.naver?query=${enc(p.name+" 후기")}`]);
  }
  return L.map(([t,u])=>`<a class="act" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join("");
}
function openPlace(p){

  const s = curPlace, saved = !!data.places[s.id];
  const dBase = dist(data.base, s);
  const isApt = s.kind==="apt";
  openSheet(`
    <div class="sh">${closeX}
      <div class="cat"><span style="color:${COLOR[s.kind]||"var(--apt)"};font-weight:700">${esc(KIND_LABEL[s.kind]||"장소")}</span>${s.cat?`<span>${esc(s.cat.split(" > ").slice(-1)[0])}</span>`:""}</div>
      <h2>${esc(s.name)}</h2>
      <div class="addr">${esc(s.addr||"")}</div>
      <div class="addr">${esc(data.base.name||"기준 위치")}까지 ${fmtD(dBase)} · 걸어서 약 ${walk(dBase)}</div>
    </div>
    <div class="acts">${s.phone?`<a class="act" href="tel:${esc(s.phone.replace(/[^0-9+]/g,""))}">전화 ${esc(s.phone)}</a>`:""}${linksFor(s)}</div>
    ${isApt?`<div class="blk"><div class="blkh"><span>주변 아이 시설</span><span id="nbMeta">찾는 중</span></div><div id="nb"><div class="muted">반경 내 시설을 찾고 있습니다…</div></div></div>`:""}
    <div class="blk">
      <div class="blkh"><span>내 평가</span>${saved?`<span>${esc(s.updatedAt?s.updatedAt.slice(0,10):"")}</span>`:""}</div>
      <div class="seg" id="stSeg">${STATUS.map(([k,l])=>`<button data-s="${k}" aria-pressed="${s.status===k}">${l}</button>`).join("")}</div>
      <div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button data-r="${i}" class="${(s.rating||0)>=i?"on":""}" aria-label="별 ${i}개">★</button>`).join("")}</div>
      ${isApt?`<div class="two"><label class="fld"><span>가격 (매매·전세)</span><input id="pPrice" value="${esc(s.price||"")}" placeholder="예: 전세 4.2억"></label>

        <label class="fld"><span>방문일</span><input type="date" id="pVisit" value="${esc(s.visit||"")}"></label>`:""}
      <label class="fld"><span>메모</span><textarea id="pMemo" placeholder="${isApt?"채광, 언덕, 관리 상태, 주차, 단지 분위기…":"선생님, 대기, 분위기…"}">${esc(s.memo||"")}</textarea></label>
      <div class="btns ${saved?"two":""}" style="padding-bottom:14px">${saved?`<button class="btn danger" data-a="unsave">기록 삭제</button>`:""}<button class="btn primary" data-a="savePlace">${saved?"저장":"기록하기"}</button></div>
    </div>`, sh=>{

async function nearby(s){
  const loc = LL(s.lat, s.lng), D = kakao.maps.services.SortBy.DISTANCE;
  const near = (type,q,radius,extra,pages) => query(type, q, Object.assign({location:loc, radius, sort:D}, extra||{}), pages||1);
  const [kidsAll, ped1, ped2, sch, st] = await Promise.all([
    near("cat","PS3",500,null,3),
    near("kw","소아청소년과",1500,{category_group_code:"HP8"}),
    near("kw","아동병원",2000,{category_group_code:"HP8"}),
    near("cat","SC4",1500),
    near("cat","SW8",2000)
  ]);
  if(!curPlace || curPlace.id!==s.id || !$("#nb")) return;
  const kinder = kidsAll.filter(p=>/유치원/.test(p.place_name)), kids = kidsAll.filter(p=>!/유치원/.test(p.place_name));
  const ped = ped1.concat(ped2).filter((p,i,a)=>/소아|아동/.test(p.place_name+p.category_name) && a.findIndex(x=>x.id===p.id)===i).sort((a,b)=>a.distance-b.distance);
  const school = sch.filter(p=>/초등학교$/.test(p.place_name));
  const row = (label, p, kind) => p ? `<button class="r tap" data-pid="${esc(p.id)}" data-kind="${kind}"><span class="k">${label}</span><span class="v">${esc(p.place_name)} · ${fmtD(+p.distance)}</span></button>` : `<div class="r"><span class="k">${label}</span><span class="v" style="color:var(--sub)">근처에 없음</span></div>`;
  window.__nb = {}; [...kidsAll, ...ped, ...school, ...st].forEach(p=>window.__nb[p.id]=p);
  $("#nbMeta").textContent = "반경 500m";
  $("#nb").innerHTML =
    `<div class="r"><span class="k">어린이집</span><span class="v"><b>${kids.length}</b>곳</span></div>` +
    `<div class="r"><span class="k">유치원</span><span class="v"><b>${kinder.length}</b>곳</span></div>` +
    kids.slice(0,3).map(p=>row("　가까운 어린이집", p, "kids")).join("") +
    kinder.slice(0,2).map(p=>row("　가까운 유치원", p, "kinder")).join("") +
    row("소아과", ped[0], "ped") + row("초등학교", school[0], "school") + row("지하철", st[0], "station");
}
$("#sheet").addEventListener("click", e=>{
  const t = e.target.closest("[data-a],[data-pid]"); if(!t) return;
  if(t.dataset.pid){ const p = window.__nb && window.__nb[t.dataset.pid]; if(p){ const q=fromKakao(p, t.dataset.kind); map.panTo(LL(q.lat,q.lng)); openPlace(q); } return; }
  const a = t.dataset.a;
  if(a==="close") back();
  else if(a==="savePlace"){
    const s = curPlace; const sh = $("#sheet");
    const stB = sh.querySelector('#stSeg button[aria-pressed="true"]');
    const rec = {id:s.id, name:s.name, lat:s.lat, lng:s.lng, kind:s.kind, cat:s.cat||"", addr:s.addr||"", phone:s.phone||"", url:s.url||"",
      status: stB ? stB.dataset.s : "", rating: s._r!==undefined ? s._r : (s.rating||0),
      price: sh.querySelector("#pPrice") ? sh.querySelector("#pPrice").value.trim() : "",
      unit: sh.querySelector("#pUnit") ? sh.querySelector("#pUnit").value.trim() : "",
      visit: sh.querySelector("#pVisit") ? sh.querySelector("#pVisit").value : "",
      memo: sh.querySelector("#pMemo").value, createdAt: (data.places[s.id]||{}).createdAt || new Date().toISOString(), updatedAt: new Date().toISOString()};
    data.places[s.id] = rec; save(); if(ready) drawSaved(); toast("기록했습니다"); back();
  }
  else if(a==="unsave"){
    delete data.places[curPlace.id]; save(); if(ready){ drawSaved(); refreshLayers(); } toast("기록을 지웠습니다"); back();
  }
  else if(a==="editMemo"){ const id=t.dataset.id; backThen(()=>openMemoForm(data.memos.find(m=>m.id===id))); }
  else if(a==="delMemo"){ t.closest(".btns").outerHTML = `<div class="btns two" style="padding-bottom:14px"><button class="btn" data-a="close">취소</button><button class="btn danger" data-a="delMemoYes" data-id="${esc(t.dataset.id)}">정말 삭제</button></div>`; }
  else if(a==="delMemoYes"){ data.memos = data.memos.filter(m=>m.id!==t.dataset.id); save(); if(ready) drawMemos(); toast("메모를 지웠습니다"); back(); }
});

/* memo detail */
function openMemo(id){
  const n = data.memos.find(m=>m.id===id); if(!n) return;
  const tone = TONES.find(t=>t[0]===(n.tone||"note"));
  openSheet(`
    <div class="sh">${closeX}
      <div class="cat"><span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:${tone[2]}"></span><span>내 메모 · ${esc(tone[1])}</span><span>${esc((n.updatedAt||n.createdAt||"").slice(0,10))}</span></div>
      <h2>${esc(n.title||"메모")}</h2>
      <div class="addr">${esc(data.base.name||"기준 위치")}에서 ${fmtD(dist(data.base,n))}</div>
    </div>
    <div class="blk">
      ${n.text?`<div class="memotext">${esc(n.text)}</div>`:""}
      ${(n.tags||[]).length?`<div class="tagline">${n.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
      ${!n.text && !(n.tags||[]).length?`<div class="muted">내용 없음</div>`:""}
    </div>
    <div class="btns two" style="padding-bottom:14px"><button class="btn danger" data-a="delMemo" data-id="${esc(n.id)}">삭제</button><button class="btn primary" data-a="editMemo" data-id="${esc(n.id)}">수정</button></div>`);
}

/* ---------- memo placing + form ---------- */
$("#memoBtn").onclick = ()=>{
  if(!ready){ toast("지도를 불러온 뒤 쓸 수 있습니다"); return; }
  push("placing", ()=>document.body.classList.add("placing"), ()=>document.body.classList.remove("placing"));
};
$("#placeCancel").onclick = back;
$("#placeOk").onclick = ()=>{
  const c = map.getCenter(); const pos = {lat:c.getLat(), lng:c.getLng()};
  backThen(()=>openMemoForm(null, pos));
};
let memoDraft = null;
function openMemoForm(n, pos){
  memoDraft = n ? JSON.parse(JSON.stringify(n)) : {id:null, lat:pos.lat, lng:pos.lng, title:"", text:"", tone:"note", tags:[]};
  const d = memoDraft, el = $("#pMemo");
  el.innerHTML = `
    <header class="pbar"><button class="ibtn" data-a="back" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="ttl">${n?"메모 수정":"지도 메모"}</span><button class="tbtn" data-a="save">저장</button></header>
    <div class="pbody">
      <div class="blk">
        <label class="fld"><span>제목 (지도에 보이는 글자)</span><input id="mT" maxlength="30" value="${esc(d.title)}" placeholder="예: 오르막 심함, 밤에 조용"></label>
        <label class="fld"><span>내용</span><textarea id="mX" placeholder="자세한 내용">${esc(d.text)}</textarea></label>
      </div>
      <div class="blk"><div class="blkh"><span>느낌</span></div>
        <div class="tone" id="mTone">${TONES.map(([k,l,c])=>`<button data-t="${k}" aria-pressed="${d.tone===k}"><i style="background:${c}"></i>${l}</button>`).join("")}</div></div>
      <div class="blk"><div class="blkh"><span>태그</span></div>
        <div class="tags" id="mTags">${TAGS.map(t=>`<button class="tag" data-g="${esc(t)}" aria-pressed="${d.tags.includes(t)}">${esc(t)}</button>`).join("")}</div></div>
    </div>`;
  el.querySelector("#mTone").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; d.tone=b.dataset.t; el.querySelectorAll("#mTone button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); };
  el.querySelector("#mTags").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; const g=b.dataset.g; const on=d.tags.includes(g);
    d.tags = on ? d.tags.filter(x=>x!==g) : d.tags.concat([g]); b.setAttribute("aria-pressed", String(!on)); };
  push("memo", ()=>{ el.classList.add("open"); el.scrollTop=0; if(!n) setTimeout(()=>{ try{ el.querySelector("#mT").focus(); }catch(e){} }, 250); }, ()=>el.classList.remove("open"));
}
$("#pMemo").addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  if(b.dataset.a==="back"){ back(); return; }
  const d = memoDraft; d.title = $("#mT").value.trim(); d.text = $("#mX").value;
  if(!d.title && !d.text.trim()){ toast("제목이나 내용을 적어 주세요"); return; }
  if(!d.title) d.title = d.text.trim().split("\n")[0].slice(0,20);
  d.updatedAt = new Date().toISOString();
  if(!d.id){ d.id = uid(); d.createdAt = d.updatedAt; data.memos.push(d); }
  else { const i = data.memos.findIndex(m=>m.id===d.id); if(i>=0) data.memos[i]=d; }
  save(); if(ready){ if(!layerOn.memo){ layerOn.memo=true; ls.set(K.layers,layerOn); renderChips(); } drawMemos(); }
  back(); toast("메모를 남겼습니다");
});

/* ---------- search ---------- */
$("#searchForm").addEventListener("submit", async e=>{
  e.preventDefault(); const q = $("#q").value.trim(); if(!q || !ready) return; $("#q").blur();
  const res = await query("kw", q, {location: LL(data.base.lat, data.base.lng), radius: 20000, sort: kakao.maps.services.SortBy.ACCURACY}, 1);
  if(!res.length){ toast("검색 결과가 없습니다"); return; }
  window.__sr = {}; res.forEach(p=>window.__sr[p.id]=p);
  openSheet(`<div class="sh">${closeX}<div class="cat">검색 결과 ${res.length}건</div><h2>${esc(q)}</h2></div>
    <div class="blk">${res.map(p=>`<button class="li" data-sr="${esc(p.id)}"><b>${esc(p.place_name)}</b><span class="s">${esc((p.category_name||"").split(" > ").slice(-1)[0])} · ${esc(p.road_address_name||p.address_name)} · ${fmtD(dist(data.base,{lat:+p.y,lng:+p.x}))}</span></button>`).join("")}</div>`,
    sh=>sh.addEventListener("click", ev=>{ const b=ev.target.closest("[data-sr]"); if(!b) return; const p=window.__sr[b.dataset.sr]; const s=fromKakao(p, kindFromCat(p));
      map.setLevel(3); map.panTo(LL(s.lat,s.lng)); openPlace(s); }));
});

/* ---------- buttons ---------- */
$("#baseBtn").onclick = ()=>{ if(ready){ map.setLevel(4); map.panTo(LL(data.base.lat, data.base.lng)); } };
$("#locBtn").onclick = ()=>{
  if(!ready) return; if(!navigator.geolocation){ toast("위치 기능을 쓸 수 없습니다"); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(meMark) meMark.setMap(null); meMark = overlay(lat,lng,`<div class="mk me"></div>`,0.5,8,()=>{});
    map.panTo(LL(lat,lng));
  }, ()=>toast("위치 권한을 허용해 주세요"), {enableHighAccuracy:true, timeout:10000});
};

/* ---------- list page ---------- */
let listTab = "places";
function openList(){ renderList(); const el=$("#pList"); push("list", ()=>{ el.classList.add("open"); el.scrollTop=0; }, ()=>el.classList.remove("open")); }
function renderList(){
  const el = $("#pList");
  const order = {interest:0, plan:1, visited:2, "":3, no:4};
  const pl = Object.values(data.places).sort((a,b)=>(order[a.status||""]-order[b.status||""]) || (b.rating||0)-(a.rating||0) || (b.updatedAt||"").localeCompare(a.updatedAt||""));
  const ms = data.memos.slice().sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const stl = k => (STATUS.find(s=>s[0]===k)||[])[1];
  el.innerHTML = `
    <header class="pbar"><button class="ibtn" data-a="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl">내 기록</span></header>
    <div class="ptabs"><button data-t="places" aria-pressed="${listTab==="places"}">단지·장소 ${pl.length}</button><button data-t="memos" aria-pressed="${listTab==="memos"}">지도 메모 ${ms.length}</button></div>
    <div class="pbody">
    ${listTab==="places"
      ? (pl.length ? `<div class="blk">${pl.map(s=>`<button class="li" data-go="p:${esc(s.id)}"><b>${esc(s.name)}</b>${s.status?`<span class="badge b-${s.status}">${stl(s.status)}</span>`:""}${s.rating?`<span style="color:#E09A00;margin-left:6px;font-weight:700">★${s.rating}</span>`:""}
          <span class="s">${esc(KIND_LABEL[s.kind]||"")}${s.price?` · ${esc(s.price)}`:""}${s.unit?` · ${esc(s.unit)}`:""} · ${fmtD(dist(data.base,s))}</span>${s.memo?`<span class="s">${esc(s.memo.split("\n")[0])}</span>`:""}</button>`).join("")}</div>`
        : `<div class="hint">지도에서 아파트나 어린이집을 누르고 ‘기록하기’를 하면 여기에 모입니다.</div>`)
      : (ms.length ? `<div class="blk">${ms.map(n=>`<button class="li" data-go="m:${esc(n.id)}"><b>${esc(n.title||"메모")}</b><span class="s">${esc((TONES.find(t=>t[0]===(n.tone||"note"))||[])[1])}${(n.tags||[]).length?" · "+esc(n.tags.join(", ")):""}</span>${n.text?`<span class="s">${esc(n.text.split("\n")[0])}</span>`:""}</button>`).join("")}</div>`
        : `<div class="hint">아래 ‘지도에 메모’로 동네 특징을 남기면 여기에 모입니다.</div>`)}
    </div>`;
}
$("#pList").addEventListener("click", e=>{
  const t = e.target.closest("[data-a],[data-t],[data-go]"); if(!t) return;
  if(t.dataset.a==="back"){ back(); return; }
  if(t.dataset.t){ listTab=t.dataset.t; renderList(); return; }
  const [type,id] = t.dataset.go.split(/:(.+)/);
  backThen(()=>{
    if(type==="p"){ const s=data.places[id]; if(!s) return; if(ready){ map.setLevel(3); map.panTo(LL(s.lat,s.lng)); } openPlace(s); }
    else { const n=data.memos.find(m=>m.id===id); if(!n) return; if(ready){ map.setLevel(3); map.panTo(LL(n.lat,n.lng)); } openMemo(id); }
  });
});
$("#listBtn").onclick = openList;

/* ---------- settings ---------- */
let deferredInstall=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall=e; });
function download(name, text, type){ const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function openSettings(){
  const el = $("#pSet"); const standalone = matchMedia("(display-mode: standalone)").matches;
  el.innerHTML = `
    <header class="pbar"><button class="ibtn" data-a="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl">설정</span></header>
    <div class="pbody">
      ${!standalone?`<div class="blk"><button class="li" data-a="install"><b>홈 화면에 앱 설치</b><span class="s">주소창 없이 독립된 앱으로 열립니다</span></button></div>`:""}
      <div class="blk"><div class="blkh"><span>기준 위치</span><span>${esc(data.base.name)}</span></div>
        <label class="fld"><span>이름</span><input id="bName" value="${esc(data.base.name)}"></label>
        <button class="li" data-a="baseHere"><b>지금 지도 가운데를 기준으로</b><span class="s">거리·도보 시간을 이 위치 기준으로 계산합니다</span></button>
        <button class="li" data-a="baseReset"><b>한성대로 되돌리기</b></button></div>
      <div class="blk"><div class="blkh"><span>백업</span></div>
        <button class="li" data-a="backup"><b>백업 파일 저장</b><span class="s">평가와 메모를 .json으로 다운로드 폴더에 저장</span></button>
        <button class="li" data-a="restore"><b>백업 파일 불러오기</b><span class="s">같은 항목은 덮어쓰고 없는 항목은 추가</span></button>
        <button class="li" data-a="csv"><b>단지 평가 CSV 저장</b><span class="s">엑셀에서 비교할 때</span></button></div>
      <div class="hint">기록은 이 휴대폰 안에만 저장됩니다. 앱을 지우면 함께 사라지니 가끔 백업해 두세요.</div>
      <div class="blk"><button class="li" data-a="key"><b>카카오 키 바꾸기</b><span class="s">${esc((ls.get(K.key,"")||"없음").slice(0,6))}…</span></button></div>
    </div>`;
  el.querySelector("#bName").onchange = e=>{ data.base.name = e.target.value.trim() || "기준"; save(); if(ready) drawBase(); };
  push("set", ()=>{ el.classList.add("open"); el.scrollTop=0; }, ()=>el.classList.remove("open"));
}
$("#pSet").addEventListener("click", async e=>{
  const t = e.target.closest("[data-a]"); if(!t) return; const a=t.dataset.a;
  if(a==="back") back();
  else if(a==="install"){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } else toast("브라우저 메뉴(⋮)에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 누르세요"); }
  else if(a==="baseHere"){ if(!ready) return; const c=map.getCenter(); data.base = {name:$("#bName").value.trim()||"기준", lat:c.getLat(), lng:c.getLng()}; save(); drawBase(); toast("기준 위치를 바꿨습니다"); }
  else if(a==="baseReset"){ data.base = Object.assign({}, DEFAULT_BASE); save(); if(ready) drawBase(); back(); toast("한성대를 기준으로 되돌렸습니다"); }
  else if(a==="backup") download(`집지도-백업-${today()}.json`, JSON.stringify({app:"housemap",version:1,exportedAt:new Date().toISOString(),data},null,1), "application/json");
  else if(a==="csv"){
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`; const stl=k=>(STATUS.find(s=>s[0]===k)||[])[1]||"";
    const rows=[["이름","종류","상태","별점","가격","평형·층","방문일",`${data.base.name}까지(m)`,"주소","메모"].map(q).join(",")]
      .concat(Object.values(data.places).map(s=>[s.name,KIND_LABEL[s.kind],stl(s.status),s.rating||"",s.price,s.unit,s.visit,Math.round(dist(data.base,s)),s.addr,s.memo].map(q).join(",")));
    download(`집지도-평가-${today()}.csv`, "﻿"+rows.join("\r\n"), "text/csv;charset=utf-8");
  }
  else if(a==="restore") $("#fileIn").click();
  else if(a==="key"){ backThen(()=>showSetup()); }
});
$("#fileIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const j=JSON.parse(await f.text()); const d=j.data||j; if(!d || typeof d.places!=="object" || !Array.isArray(d.memos)) throw 0;
    Object.assign(data.places, d.places);
    d.memos.forEach(m=>{ if(!m||!m.id) return; const i=data.memos.findIndex(x=>x.id===m.id); if(i>=0) data.memos[i]=m; else data.memos.push(m); });
    save(); if(ready){ drawSaved(); drawMemos(); } toast(`단지 ${Object.keys(d.places).length}곳, 메모 ${d.memos.length}개를 불러왔습니다`);
  }catch(_){ toast("백업 파일 형식이 아닙니다"); }
});
$("#setBtn").onclick = openSettings;
$("#scrim").onclick = back;

/* ---------- start ---------- */
renderChips(); updateCount(); loadKakao();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
